name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "registry.json"
      - "registry/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            docs-site/pnpm-lock.yaml

      - name: Install package dependencies
        run: pnpm install --frozen-lockfile

      # The docs site imports the real component for its live demos through a
      # `link:..` dependency, which resolves to dist/ — so the library has to
      # be built before the docs are, or the demo imports resolve to nothing.
      - name: Build the library
        run: pnpm build

      # Regenerated here rather than trusted from the commit, so the served
      # registry JSON can never drift from registry.json / image-view.tsx —
      # the same guarantee the CSS preset gets by being part of `pnpm build`.
      - name: Build the shadcn registry
        run: pnpm registry:build

      - name: Install docs-site dependencies
        working-directory: docs-site
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: docs-site
        env:
          GITHUB_PAGES: "true"
        run: pnpm build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
