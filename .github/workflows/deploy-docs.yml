name: Deploy docs

# No path filter, deliberately.
#
# The docs site embeds the real component for its live demos through a
# `link:..` dependency, so its output depends on src/ as much as on
# docs-site/. The filter this replaces listed only docs-site, registry, and
# this workflow — and it silently skipped the deploy for the accessibility
# release, leaving the published demos running a build whose thumbnails were
# not keyboard-reachable.
#
# A filter here has to encode the docs' entire dependency graph to be correct,
# and gets quietly wrong every time that graph changes. Building on every push
# to main costs a couple of minutes and cannot go stale.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            docs-site/pnpm-lock.yaml

      - name: Install package dependencies
        run: pnpm install --frozen-lockfile

      # The docs site imports the real component for its live demos through a
      # `link:..` dependency, which resolves to dist/ — so the library has to
      # be built before the docs are, or the demo imports resolve to nothing.
      - name: Build the library
        run: pnpm build

      # Regenerated here rather than trusted from the commit, so the served
      # registry JSON can never drift from registry.json / image-view.tsx —
      # the same guarantee the CSS preset gets by being part of `pnpm build`.
      - name: Build the shadcn registry
        run: pnpm registry:build

      - name: Install docs-site dependencies
        working-directory: docs-site
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: docs-site
        env:
          GITHUB_PAGES: 'true'
        run: pnpm build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
