name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # Deliberately 22 while release.yml runs 24: the release workflow runs
      # this same suite on the Node it actually publishes from, so pinning a
      # different version here buys a second Node in the test matrix rather
      # than duplicating coverage.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The CSS preset and the shadcn registry block are the same UI written
      # twice; this fails if one has grown a control the other lacks.
      - name: Check the registry has not drifted
        run: pnpm registry:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright's browser
        run: pnpm exec playwright install --with-deps chromium

      # functional only here; the visual suite needs Linux baselines and runs
      # in its own job below. See the comment in playwright.config.ts.
      - name: E2E
        run: pnpm e2e --project=functional

  # Separate job because it is the one suite that cannot run until Linux
  # baselines exist. Playwright already suffixes snapshots with the platform,
  # so `-linux.png` files sit next to the committed `-darwin.png` ones and
  # neither platform invalidates the other.
  #
  # The guard makes this job self-enabling: it reports and skips while no
  # Linux baselines are committed, and starts enforcing the moment they are —
  # without a second commit to turn it on. Generate them by running the
  # "Visual baselines" workflow and committing the artifact it uploads.
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Look for Linux baselines
        id: baselines
        run: |
          if ls e2e/*-snapshots/*-linux.png >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Linux visual baselines committed yet. Run the 'Visual baselines' workflow and commit its artifact to enable this job."
          fi

      - uses: pnpm/action-setup@v6
        if: steps.baselines.outputs.present == 'true'

      - uses: actions/setup-node@v7
        if: steps.baselines.outputs.present == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.baselines.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.baselines.outputs.present == 'true'
        run: pnpm build

      - name: Install Playwright's browser
        if: steps.baselines.outputs.present == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Visual regression
        if: steps.baselines.outputs.present == 'true'
        run: pnpm e2e --project=visual

      - name: Upload the diffs when they disagree
        if: failure() && steps.baselines.outputs.present == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: visual-diff
          path: test-results/
          retention-days: 7
