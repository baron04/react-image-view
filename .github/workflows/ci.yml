name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # Deliberately 22 while release.yml runs 24: the release workflow runs
      # this same suite on the Node it actually publishes from, so pinning a
      # different version here buys a second Node in the test matrix rather
      # than duplicating coverage.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The CSS preset and the shadcn registry block are the same UI written
      # twice; this fails if one has grown a control the other lacks.
      - name: Check the registry has not drifted
        run: pnpm registry:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright's browser
        run: pnpm exec playwright install --with-deps chromium

      # functional only: the visual baselines are macOS-rendered and would
      # fail on a Linux runner for font-rasterisation reasons alone. See the
      # comment in playwright.config.ts.
      - name: E2E
        run: pnpm e2e --project=functional
