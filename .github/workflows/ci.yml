name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # Deliberately 22 while release.yml runs 24: the release workflow runs
      # this same suite on the Node it actually publishes from, so pinning a
      # different version here buys a second Node in the test matrix rather
      # than duplicating coverage.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Prettier owns the formatting, but nothing enforced it until now, so ten
      # tracked files had drifted out of style without anyone seeing a failure.
      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # The CSS preset and the shadcn registry block are the same UI written
      # twice; this fails if one has grown a control the other lacks.
      - name: Check the registry has not drifted
        run: pnpm registry:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright's browser
        run: pnpm exec playwright install --with-deps chromium

      # functional only here; the visual suite needs Linux baselines and runs
      # in its own job below. See the comment in playwright.config.ts.
      - name: E2E
        run: pnpm e2e --project=functional

  # Separate job because the baselines are per-platform. Playwright suffixes
  # snapshots with the platform, so the `-linux.png` files this job compares
  # against sit next to the `-darwin.png` ones written on a Mac and neither
  # invalidates the other. Regenerate the Linux set with the "Visual
  # baselines" workflow, which is the only way to produce them from a Mac.
  #
  # A missing baseline fails this job rather than skipping it — the suite is
  # worth nothing if losing its snapshots also loses the red light.
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install Playwright's browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Visual regression
        run: pnpm e2e --project=visual

      - name: Upload the diffs when they disagree
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diff
          path: test-results/
          retention-days: 7
